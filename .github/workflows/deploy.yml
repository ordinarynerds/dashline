name: deploy

on:
  push:
    branches: [main]
    paths: ['playground/**', 'CHANGELOG.md', 'package.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - name: No Cloudflare token configured
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning title=Cloudflare deploy skipped::Add a CLOUDFLARE_API_TOKEN repository secret (Cloudflare template: Edit Cloudflare Workers) to deploy dashline.ordinarynerds.com from CI. Until then the canonical host only updates on a local 'wrangler deploy'."
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
        if: env.HAS_TOKEN == 'true'
      - run: npm run build
        if: env.HAS_TOKEN == 'true'
      - uses: cloudflare/wrangler-action@v4
        if: env.HAS_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: playground
          command: deploy
