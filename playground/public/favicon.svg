<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="dashline">
  <!-- dashline's mark: a status line reduced to two bars, the shorter one carrying the coral. It
       rhymes with the cursor in the Dashline_ wordmark and keeps the brand's one signal colour
       doing the signalling.

       Drawn for 16px first. Earlier passes used three and four dashes with hairline gaps; below
       about 2.5 device pixels a stroke stops resolving, so at tab size they collapsed into a
       smear. Two bars at 4.6 of 32 units stay crisp even without a retina display. -->
  <rect width="32" height="32" rx="7" fill="#0c0c0e" />
  <rect x="6" y="10.5" width="19" height="4.6" rx="2.3" fill="#f5f5f5" />
  <rect x="6" y="18" width="11" height="4.6" rx="2.3" fill="#ff6b4a" />
</svg>
